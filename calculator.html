<section id="calculator-hero">

<h2>Carbon Footprint Calculator</h2>

<p>
Calculate your estimated environmental impact.
</p>

</section>




<!-- CALCULATOR FORM -->


<section id="calculator">


<h2>Enter Your Lifestyle Details</h2>


<form id="carbonForm">



<label>
Transport Hours Per Week
</label>


<input 
type="number"
id="transport"
min="0"
required>




<label>
Electricity Usage Level (1-10)
</label>


<input 
type="number"
id="electricity"
min="1"
max="10"
required>




<label>
Food Impact Level (1-10)
</label>


<input 
type="number"
id="food"
min="1"
max="10"
required>




<label>
Recycling Effort (1-10)
</label>


<input 
type="number"
id="recycling"
min="1"
max="10"
required>




<button type="submit">

Calculate Footprint

</button>



</form>




<div id="result">

</div>


</section>




<footer>

<h3>
🌱 EcoLife Challenge
</h3>

<p>
Small actions today create a better planet tomorrow.
</p>
